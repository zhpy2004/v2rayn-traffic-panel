<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>WebRTC probe</title></head>
<body>
<pre id="out">running</pre>
<script>
  // 收集 ICE 候选，用来观察 WebRTC 是否绕过代理把真实公网 IP 暴露给 STUN。
  const state = { candidates: [], errors: [], done: false };
  window.__probe = state;
  const out = document.getElementById('out');

  function render() {
    out.textContent = JSON.stringify(state, null, 2);
  }

  try {
    const pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.miwifi.com:3478' },
        { urls: 'stun:stun.qq.com:3478' }
      ],
      iceCandidatePoolSize: 0
    });
    pc.createDataChannel('probe');
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        state.candidates.push(e.candidate.candidate);
        render();
      } else {
        state.done = true;
        render();
      }
    };
    pc.createOffer()
      .then((offer) => pc.setLocalDescription(offer))
      .catch((err) => { state.errors.push(String(err)); render(); });

    setTimeout(() => { state.timeout = true; render(); }, 9000);
  } catch (err) {
    state.errors.push(String(err));
    render();
  }
</script>
</body>
</html>
